<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sale Details</title>
    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #e5e7eb;
        padding: 8px;
        text-align: left;
      }
      th {
        background: #f9fafb;
      }
      .muted {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Sale</h1>
    <div id="meta" class="muted">Loading…</div>
    <table id="items" style="margin-top: 12px; display: none">
      <thead>
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Unit Price</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <h3 id="totals" style="margin-top: 12px"></h3>
    <script>
      (async function () {
        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        const title = document.getElementById("title");
        const meta = document.getElementById("meta");
        const tbl = document.getElementById("items");
        const tbody = tbl.querySelector("tbody");
        const totals = document.getElementById("totals");
        function money(n) {
          try {
            return "$" + Number(n || 0).toFixed(2);
          } catch (e) {
            return "$0.00";
          }
        }
        if (!id) {
          title.textContent = "Sale";
          meta.textContent = "Missing sale id";
          return;
        }
        try {
          const res = await fetch(`/api/sales/${encodeURIComponent(id)}`, {
            headers: { Accept: "application/json" },
          });
          if (!res.ok) throw new Error("Failed to load");
          const s = await res.json();
          const saleNumber = s.sale_number || s.id || id;
          title.textContent = `Sale ${saleNumber}`;
          const createdAt =
            s.created_at || s.createdAt || new Date().toISOString();
          const payment = s.payment_method || "cash";
          meta.textContent = `Date: ${new Date(createdAt).toLocaleString()} • Payment: ${payment}`;
          const items = Array.isArray(s.saleItems)
            ? s.saleItems
            : Array.isArray(s.sale_items)
              ? s.sale_items
              : Array.isArray(s.cart)
                ? s.cart.map((i) => ({
                    product_name: i.name,
                    quantity: i.quantity,
                    unit_price: i.price,
                    total_price: (i.price || 0) * (i.quantity || 1),
                  }))
                : [];
          let subtotal = s.subtotal ?? s.sub_total ?? 0;
          let tax = s.tax_amount ?? s.tax ?? 0;
          let discount = s.discount_amount ?? 0;
          let total = s.total_amount ?? s.total ?? subtotal - discount + tax;
          if (
            !(s.subtotal != null || s.total != null || s.total_amount != null)
          ) {
            subtotal = items.reduce(
              (a, i) => a + Number(i.unit_price || 0) * Number(i.quantity || 1),
              0,
            );
            total = subtotal;
          }
          tbody.innerHTML = items
            .map(
              (i) =>
                `<tr><td>${i.product_name || i.name || "Item"}</td><td>${Number(i.quantity || 1)}</td><td>${money(i.unit_price != null ? i.unit_price : i.price)}</td><td>${money(i.total_price != null ? i.total_price : Number(i.unit_price || i.price || 0) * Number(i.quantity || 1))}</td></tr>`,
            )
            .join("");
          tbl.style.display = "";
          totals.textContent = `Subtotal: ${money(subtotal)} • Tax: ${money(tax)} • Discount: ${money(discount)} • Total: ${money(total)}`;
        } catch (e) {
          meta.textContent = "Failed to load sale";
        }
      })();
    </script>
  </body>
</html>
