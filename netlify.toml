[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

[functions."weekly-export"]
  schedule = "@weekly"
  timeout = 900

# API requests -> Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback -> index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
