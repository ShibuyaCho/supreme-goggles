version: "3.9"

services:
  mysql:
    image: mysql:8.4 # LTS
    container_name: dev-mysql
    restart: unless-stopped
    command:
      # Sensible defaults
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-UTC}
    ports:
      - "${MYSQL_PORT:-3307}:3306" # change MYSQL_PORT in .env if 3306 is taken
    volumes:
      - mysql_data:/var/lib/mysql
      # Any .sql or .sh here runs **once** on first init (when data dir is empty)
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./99-custom.cnf:/etc/mysql/conf.d/99-custom.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD | grep 'mysqld is alive'"]
      interval: 5s
      timeout: 3s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: dev-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
